<div class="min-h-screen flex items-center justify-center bg-neutral-900 text-gray-100 px-4">
  <div class="text-center max-w-lg">

    <h1 class="text-9xl font-black text-indigo-400 mb-4">404</h1>

    <h2 class="text-2xl font-bold mb-4">Page Not Found</h2>

    <p class="text-gray-400 mb-8">
      The page you're looking for doesn't exist.
    </p>

    <div class="flex gap-4 justify-center">
      
      <!-- Home Button -->
      <button
        mat-raised-button
        color="primary"
        class="!bg-neutral-600 hover:!bg-neutral-500 !text-white flex items-center gap-2 px-6 py-2 "
        (click)="goHome()"
      >
        <mat-icon>home</mat-icon>
        Home
      </button>

      <!-- Back Button -->
      <button
        mat-stroked-button
        color="primary"
        class="!bg-neutral-600 hover:!bg-neutral-500 !text-white flex items-center gap-2 px-6 py-2 "
        (click)="goBack()"
      >
        <mat-icon>arrow_back</mat-icon>
        Back
      </button>
