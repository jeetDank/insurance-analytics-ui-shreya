<div
  class="my-3"
  [ngClass]="{
    'msg-bubble-system': isProcess(),
    'msg-bubble-user': !isProcess(),
    'me-auto': isSystemMsg(),
    'ms-auto': !isSystemMsg()
  }"
>
  <div class="">
    <ng-content></ng-content>
  </div>
  <div class="text-left" style="margin-top: 6px;">
    <small>{{ timestamp() }}</small>
  </div>
</div>
