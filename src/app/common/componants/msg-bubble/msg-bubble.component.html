<div
  [class]="isProcess()?'my-3 border system_background border-neutral-900':'my-3 card-background border border-neutral-900'"
  style="width:284px;border-radius: 18px;padding: 16px;overflow-y: auto;overflow-x: hidden;"
  [ngClass]="isSystemMsg() ? 'me-auto' : 'ms-auto'"
>
  <div class="">
    <ng-content></ng-content>
  </div>
  <div class="text-left" style="margin-top: 6px;">
    <small>{{ timestamp() }}</small>
  </div>
</div>
