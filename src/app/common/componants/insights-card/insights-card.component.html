<div class="bg-transparent border border-white/15 rounded-xl p-5">
  <!-- Icon and Title Row -->
  <div class="flex items-center gap-3 mb-3">
   <div class="bg-gray-800/30 rounded-lg p-2">
    <i class="material-icons text-blue-400 text-lg">{{ icon() }}</i>
  </div>
    <h4 class="text-primary">{{ title() }}</h4>
  </div>

  <!-- Description -->
  <small class="text-secondary leading-relaxed mb-4">
    {{ description() }}
  </small>

  <!-- Source Line -->
  <div class="text-xs text-gray-500 flex items-center gap-1">
    <i class="material-icons text-xs">source</i>
    <span>{{ source() }}</span>
  </div>
</div>
