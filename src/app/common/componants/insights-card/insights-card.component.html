<div class="bg-transparent border border-white/15 rounded-xl p-[30px] flex gap-3">
  <!-- Icon column container -->
  <div class="flex flex-col">
    <div class="bg-gray-800/30 rounded-lg p-2 flex-shrink-0">
      <i class="material-icons text-blue-400 text-lg">{{ icon() }}</i>
    </div>
  </div>

  <!-- Content Column -->
  <div class="flex flex-col gap-2 flex-1">
    <!-- Title -->
    <h4 class="text-primary">{{ title() }}</h4>

    <!-- Description -->
    <small class="text-secondary leading-relaxed">
      {{ description() }}
    </small>

    <!-- Source Line -->
    <div class="text-xs text-gray-500 flex items-center gap-1">
      <i class="material-icons text-xs">source</i>
      <span>{{ source() }}</span>
    </div>
  </div>
</div>
