<!-- ambiguity-resolver.component.html -->
<div *ngIf="ambiguities.length > 0">
  <!-- Header with Navigation -->
  <div class="flex flex-col mb-3 gap-3">
    <p class="text-sm flex-1 ambiguity-text-primary">
      Didn't understand 
      <span class="ambiguity-text-highlight">
        "{{ currentAmbiguity?.query }}".
      </span>
    </p>
    <p class="text-sm">Did you mean one of these?</p>
  </div>

  <!-- Suggestions -->
  <div class="flex flex-col gap-2 mb-4">
    <button
      *ngFor="let suggestion of currentAmbiguity?.suggestions"
      (click)="handleSuggestionClick(suggestion)"
      class="text-left px-4 py-2 text-sm transition-all"
      [ngClass]="{
        'suggestion-btn-selected': isSelected(suggestion),
        'suggestion-btn': !isSelected(suggestion)
      }"
    >
      {{ suggestion }}
    </button>
  </div>

  <!-- Pagination Controls -->
  <div *ngIf="totalAmbiguities > 1" class="flex items-center gap-2">
    <button
      (click)="handlePrevious()"
      [disabled]="!canGoPrevious"
      class="p-1 rounded transition-all"
      [ngClass]="{
        'nav-btn-enabled': canGoPrevious,
        'nav-btn-disabled': !canGoPrevious
      }"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-4 w-4"
      >
        <path d="m15 18-6-6 6-6"></path>
      </svg>
    </button>

    <span
      style="line-height: 2"
      class="text-xs min-w-[40px] text-center ambiguity-text-muted"
    >
      {{ currentIndex + 1 }} / {{ totalAmbiguities }}
    </span>

    <button
      (click)="handleNext()"
      [disabled]="!canGoNext"
      class="p-1 rounded transition-all"
      [ngClass]="{
        'nav-btn-enabled': canGoNext,
        'nav-btn-disabled': !canGoNext
      }"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-4 w-4"
      >
        <path d="m9 18 6-6-6-6"></path>
      </svg>
    </button>
  </div>

  <!-- Resolve Button -->
  <button
    *ngIf="!pendingResolution"
    [disabled]="pendingResolution"
    (click)="notifyAmbiguityResolution()"
    class="px-4 mt-2 py-2 text-sm transition-all flex items-center gap-2"
    [ngClass]="{
      'confirm-btn': !pendingResolution,
      'confirm-btn-disabled': pendingResolution
    }"
  >
    Confirm Choices
  </button>
</div>
