<div class="min-h-screen flex items-center justify-center relative overflow-hidden">

  <div style="position: fixed;right:20px;top:20px;">
    <button
      (click)="toggleTheme()"
      [title]="isDarkTheme ? 'Switch to light theme' : 'Switch to dark theme'"
      class="theme-toggle flex flex-row gap-2 items-center"
      type="button"
    >
      <!-- Sun icon for dark theme -->
      <svg
        *ngIf="isDarkTheme"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-sun h-4 w-4"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2"></path>
        <path d="M12 20v2"></path>
        <path d="m4.93 4.93 1.41 1.41"></path>
        <path d="m17.66 17.66 1.41 1.41"></path>
        <path d="M2 12h2"></path>
        <path d="M20 12h2"></path>
        <path d="m6.34 17.66-1.41 1.41"></path>
        <path d="m19.07 4.93-1.41 1.41"></path>
      </svg>
      <!-- Moon icon for light theme -->
      <svg
        *ngIf="!isDarkTheme"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-moon h-4 w-4"
        aria-hidden="true"
      >
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
      </svg>
      <span class="toolbar-btn-text">{{ isDarkTheme ? "Light" : "Dark" }}</span>
    </button>

  </div>
  <!-- Background glow -->
  <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 rounded-full blur-3xl"></div>

  <!-- Card -->
  <div class="relative z-10 w-full max-w-md mx-4 p-10 rounded-3xl backdrop-blur-xl shadow-2xl">
    <!-- Logo -->
    <div class="w-full flex items-center justify-center mb-8">
      <!-- <img src="Praavega_FutureNow_transparent.svg" alt="Praavega Logo" /> -->
    </div>

    <!-- Heading -->
    <div class="text-center login-card mb-8">
      <h1 class="text-2xl font-semibold mb-2">Welcome back</h1>
      <p class="text-sm">
        Sign in to access your financial analytics dashboard
      </p>
    </div>

    <!-- Form -->
    <form class="space-y-5" (ngSubmit)="submit()">
      <!-- Email -->
      <div>
        <label class="text-xs">Email Address</label>
        <div class="relative mt-1">
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="you@example.com"
            class="w-full h-12 pl-10 rounded-xl outline-none"
          />
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="text-xs">Password</label>
        <div class="relative mt-1">
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="••••••••"
            class="w-full h-12 pl-10 rounded-xl outline-none"
          />
        </div>
      </div>
      <div>
        @if(email.trim() != '' && password.trim() != ''){
          <div class="text-xs">{{ error }}</div>
        }
      </div>

      <!-- Options -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2">
          <input
            type="checkbox"
            [(ngModel)]="rememberMe"
            name="remember"
          />
          Remember me
        </label>
        <a href="#" class="hover:underline">Forgot password?</a>
      </div>

      <!-- Submit -->
      <button
        [disabled]="email.trim() == '' && password.trim() == ''"
        type="submit"
        class="w-full h-12 rounded-xl font-semibold transition"
      >
        Sign in →
      </button>
    </form>

    <!-- Divider -->
    <div class="my-8 flex items-center gap-3">
      <div class="flex-1 h-px"></div>
      <span class="text-xs">New to Strategy Analytics?</span>
      <div class="flex-1 h-px"></div>
    </div>

    <!-- Signup -->
    <div class="text-center">
      <a href="#" class="text-sm hover:underline">
        Create an account
      </a>
    </div>
  </div>

  <!-- Footer -->
  <!-- <div class="absolute bottom-6 text-xs">
    © 2025 Praavega Analytics. All rights reserved.
  </div> -->
</div>
