<div
  class="min-h-screen flex items-center justify-center relative overflow-hidden bg-gradient-to-br from-zinc-950 via-zinc-900 to-zinc-950 text-white"
>
  <!-- Background glow -->
  <div
    class="absolute -top-32 -left-32 w-96 h-96 bg-gray-400/10 rounded-full blur-3xl"
  ></div>
  <div
    class="absolute -bottom-32 -right-32 w-96 h-96 bg-gray-500/10 rounded-full blur-3xl"
  ></div>

  <!-- Card -->
  <div
    style="background-color: #ffffff05"
    class="relative z-10 w-full max-w-md mx-4 p-10 rounded-3xl backdrop-blur-xl border border-neutral-800 shadow-2xl"
  >
    <!-- Logo -->
    <div class="w-full flex items-center justify-center mb-8">
      
        <img style="width: 95px" src="Praavega_FutureNow_transparent.svg" alt="Praavega Logo" />
      
    </div>

    <!-- Heading -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-semibold mb-2">Welcome back</h1>
      <p class="text-sm text-white/60">
        Sign in to access your financial analytics dashboard
      </p>
    </div>

    <!-- Form -->
    <form class="space-y-5" (ngSubmit)="submit()">
      <!-- Email -->
      <div>
        <label class="text-xs text-white/70">Email Address</label>
        <div class="relative mt-1">
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="you@example.com"
            class="w-full h-12 pl-10 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/40 outline-none focus:ring-2 focus:ring-gray-400/40"
          />
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="text-xs text-white/70">Password</label>
        <div class="relative mt-1">
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="••••••••"
            class="w-full h-12 pl-10 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/40 outline-none focus:ring-2 focus:ring-gray-400/40"
          />
        </div>
      </div>
      <div>
        @if(email.trim() != '' && password.trim() != ''){

        <div class="text-xs text-red-300">{{ error }}</div>
        }
      </div>

      <!-- Options -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-white/60">
          <input
            type="checkbox"
            [(ngModel)]="rememberMe"
            name="remember"
            class="accent-gray-400"
          />
          Remember me
        </label>
        <a href="#" class="text-gray-400 hover:underline"> Forgot password? </a>
      </div>

      <!-- Submit -->
      <button
        [disabled]="email.trim() == '' && password.trim() == ''"
        type="submit"
        class="w-full h-12 rounded-xl font-semibold bg-gray-300 text-zinc-900 transition"
      >
        Sign in →
      </button>
    </form>

    <!-- Divider -->
    <div class="my-8 flex items-center gap-3">
      <div class="flex-1 h-px bg-white/10"></div>
      <span class="text-xs text-white/50">New to Praavega?</span>
      <div class="flex-1 h-px bg-white/10"></div>
    </div>

    <!-- Signup -->
    <div class="text-center">
      <a href="#" class="text-sm text-gray-400 hover:underline">
        Create an account
      </a>
    </div>
  </div>

  <!-- Footer -->
  <div class="absolute bottom-6 text-xs text-white/30">
    © 2025 Praavega Analytics. All rights reserved.
  </div>
</div>
